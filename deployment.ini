# FryNetworks Mining Hardware GUI
# Production Deployment Configuration
# Version: 5.5.0

[deployment]
version = "6.5.10"
release_date = "2026-02-23"

[application]
name = "FryNetworks Mining Hardware GUI"
description = "Advanced mining hardware monitoring and management platform"
author = "FryNetworks Development Team"
license = "Proprietary"

[features]
# Phase 3 Complete Features
theme_system = true
historical_data = true
health_monitoring = true
installer_integration = true
responsive_layout = true

# Core Features
external_api = true
service_management = true
cross_platform = true

[api]
# External API Configuration
timeout = 30
retry_attempts = 3
base_url_required = true

[database]
# Historical Data Storage
engine = "sqlite"
backup_enabled = true
retention_days = 90
auto_cleanup = true

[monitoring]
# System Health Monitoring
collection_interval = 5
alert_thresholds = true
performance_metrics = true

[ui]
# User Interface Configuration
default_theme = "dark"
responsive_breakpoints = 5
minimum_resolution = "800x600"
maximum_resolution = "unlimited"

[security]
# Security Configuration
encrypted_config = true
secure_api_keys = true
audit_logging = true

[performance]
# Performance Optimization
memory_limit = "512MB"
cpu_priority = "normal"
cache_enabled = true
lazy_loading = true

[compatibility]
# Platform Compatibility
python_min = "3.8"
python_max = "3.12"
windows_min = "10"
linux_distros = ["Ubuntu 18.04+", "CentOS 7+", "Debian 10+"]

[build]
# Build Configuration
include_dependencies = true
create_installer = true
code_signing = false
compression = "lzma"